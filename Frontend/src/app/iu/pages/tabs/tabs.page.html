<ion-tabs>

    <ion-tab-button
      tab="home"
      [routerLink]="['/tabs/home']">

      <ion-icon name="home"></ion-icon>
      <ion-label>Home</ion-label>

    </ion-tab-button>

    <ion-tab-button
      tab="my-incidents"
      [routerLink]="['/tabs/my-incidents']">

      <ion-icon name="document-text"></ion-icon>

    </ion-tab-button>

    <ion-tab-button
